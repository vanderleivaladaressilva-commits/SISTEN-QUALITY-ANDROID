name: Gerar APK SISTEN QUALITY

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          elif [ -f "./gradlew.bat" ]; then
            chmod +x ./gradlew.bat
            ./gradlew.bat assembleDebug
          else
            echo "ERRO: arquivo gradlew não encontrado."
            echo "O projeto Android/Gradle não está na raiz do repositório."
            exit 1
          fi

      - name: Localizar APK
        run: |
          echo "APKs encontrados:"
          find . -type f -name "*.apk" -print

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v6
        with:
          name: SISTEN-QUALITY-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
