apply plugin: 'com.android.application'

android {
    namespace 'com.sisten.quality'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sisten.quality'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}